<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abruzzo · 18–22 Agosto 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A22;
  --stone:#EDEAE0;
  --stone-2:#E2DED0;
  --card:#FBFAF6;
  --pine:#2F4B3C;
  --pine-2:#3E6353;
  --moss:#7C9B7E;
  --sky:#3E6E8E;
  --sky-2:#5A88A6;
  --clay:#A85A38;
  --clay-2:#C97A50;
  --gold:#B98A3D;
  --line:#D8D2C2;
  --danger:#A23B2E;
  --shadow: 0 2px 10px rgba(30,42,34,.08);
  --radius: 14px;
  color-scheme: light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  padding-bottom:90px;
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Fraunces',serif;}

/* ---------- Header ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:var(--pine);
  color:#F3EFE3;
  padding:14px 16px 0 16px;
  box-shadow:var(--shadow);
}
.top-row{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:10px;
}
.trip-title{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:.02em;
  line-height:1.05;
  margin:0;
}
.trip-sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.06em;
  opacity:.75;
  margin-top:3px;
  text-transform:uppercase;
}
.menu-btn{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.25);
  color:#F3EFE3;
  border-radius:10px;
  padding:8px 10px;
  font-size:13px;
  font-family:'Inter',sans-serif;
  display:flex; align-items:center; gap:6px;
  cursor:pointer;
}
.menu-btn:active{background:rgba(255,255,255,.2);}

/* ridge divider */
.ridge{width:100%; height:22px; display:block; margin-top:12px;}

/* day tabs */
.tabs{
  display:flex; gap:8px; overflow-x:auto;
  padding:10px 12px 12px 12px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  padding:8px 12px;
  color:#F3EFE3;
  text-align:left;
  cursor:pointer;
  min-width:74px;
}
.tab .d{font-family:'IBM Plex Mono',monospace; font-size:10px; opacity:.7; letter-spacing:.05em;}
.tab .t{font-family:'Fraunces',serif; font-weight:600; font-size:14px; margin-top:2px;}
.tab.active{
  background:#F3EFE3;
  color:var(--pine);
  border-color:#F3EFE3;
}
.tab.active .d{opacity:.55; color:var(--pine);}

/* ---------- Overview panel ---------- */
.overview-wrap{padding:12px 16px 0 16px;}
.overview-toggle{
  width:100%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 14px;
  display:flex; align-items:center; justify-content:space-between;
  font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
  color:var(--pine);
  cursor:pointer;
}
.overview-body{
  display:none;
  background:var(--card);
  border:1px solid var(--line); border-top:none;
  border-radius:0 0 var(--radius) var(--radius);
  margin-top:-1px;
  padding:6px 14px 12px 14px;
}
.overview-body.open{display:block;}
.ov-day{
  display:flex; gap:10px; padding:10px 0; border-top:1px dashed var(--line);
}
.ov-day:first-child{border-top:none;}
.ov-dot{width:8px;height:8px;border-radius:50%;margin-top:6px; flex:0 0 auto;}
.ov-txt b{font-family:'Fraunces',serif; font-size:14px;}
.ov-txt div{font-size:12.5px; color:#5B6459; margin-top:2px;}

/* ---------- Main content ---------- */
main{padding:16px; max-width:640px; margin:0 auto;}
.day-head{margin-bottom:14px;}
.day-eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:#6B7568;
}
.day-title{
  font-family:'Fraunces',serif; font-weight:700; font-size:28px;
  margin:2px 0 4px 0; line-height:1.05;
}
.day-route{font-size:13.5px; color:#5B6459;}
.badge-row{display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;}
.rating{
  font-family:'IBM Plex Mono',monospace; font-size:12px;
  background:var(--pine); color:#F3EFE3; padding:4px 9px; border-radius:20px;
}
.progress-pill{
  font-family:'IBM Plex Mono',monospace; font-size:12px;
  border:1px solid var(--line); padding:4px 9px; border-radius:20px; color:#5B6459;
}
.goal-box{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; margin-top:12px; font-size:13.5px; line-height:1.5; color:#3A4239;
  border-left:4px solid var(--accent, var(--pine));
}

/* section */
.section{margin-top:22px;}
.section-title{
  font-family:'Fraunces',serif; font-weight:600; font-size:16px;
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
  color:var(--pine);
}
.section-title .n{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B9284;
  margin-left:auto;
}

/* timeline */
.timeline{position:relative; padding-left:2px;}
.tl-item{
  display:flex; gap:12px; position:relative; padding-bottom:16px;
}
.tl-item:last-child{padding-bottom:0;}
.tl-rail{
  display:flex; flex-direction:column; align-items:center; flex:0 0 auto; width:20px;
}
.tl-dot{
  width:11px; height:11px; border-radius:50%;
  background:var(--card); border:2px solid var(--accent, var(--pine));
  margin-top:4px;
}
.tl-dot.checked{background:var(--accent, var(--pine));}
.tl-line{flex:1; width:2px; background:var(--line); margin-top:2px;}
.tl-body{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
.tl-time{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--accent,var(--pine)); font-weight:600;}
.tl-title{font-size:14.5px; font-weight:600; margin-top:2px;}
.tl-desc{font-size:13px; color:#5B6459; margin-top:4px; line-height:1.5;}
.tl-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.chip-btn{
  font-size:12px; border:1px solid var(--line); background:#fff; color:var(--pine);
  padding:5px 10px; border-radius:20px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  text-decoration:none;
}
.chip-btn.done{background:var(--pine); color:#F3EFE3; border-color:var(--pine);}
.chip-btn.map{color:var(--sky);}

/* restaurant card */
.food-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:10px; border-left:4px solid var(--clay);
}
.food-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
.food-meta{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B6142; margin-top:2px;}
.food-desc{font-size:13.5px; color:#4A4038; margin-top:6px; line-height:1.5;}

/* packing chips */
.chip-grid{display:flex; flex-wrap:wrap; gap:8px;}
.pack-chip{
  border:1px solid var(--line); background:var(--card);
  padding:8px 12px; border-radius:20px; font-size:13px; cursor:pointer;
  display:flex; align-items:center; gap:6px;
}
.pack-chip.on{background:var(--pine); color:#F3EFE3; border-color:var(--pine);}
.pack-chip.required{border-color:var(--clay); color:var(--clay); font-weight:600;}
.pack-chip.required.on{background:var(--clay); color:#fff; border-color:var(--clay);}

/* warning box */
.warn-box{
  background:#FBF1E9; border:1px solid #E7C8AE; border-left:4px solid var(--danger);
  border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.55; color:#5C2A1F;
  margin-bottom:10px;
}
.warn-box b{color:var(--danger);}

/* notes */
textarea.note{
  width:100%; min-height:70px; border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; font-family:'Inter',sans-serif; font-size:13.5px; background:var(--card);
  resize:vertical; color:var(--ink);
}
.save-hint{font-size:11px; color:#8B9284; margin-top:5px; font-family:'IBM Plex Mono',monospace;}

/* weather link */
.weather-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--sky);
  text-decoration:none; border:1px solid var(--line); padding:7px 12px; border-radius:20px; background:var(--card);
}

/* editable goal box */
textarea.goal-edit{
  width:100%; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; margin-top:12px; font-size:13.5px; line-height:1.5; color:#3A4239;
  border-left:4px solid var(--accent, var(--pine));
  font-family:'Inter',sans-serif; resize:vertical; min-height:60px;
}

/* editable packing */
.pack-chip{position:relative; padding-right:12px;}
.pack-chip .rm{
  margin-left:4px; opacity:.6; font-weight:700;
}
.pack-add-row{display:flex; gap:8px; margin-top:10px;}
.pack-add-row input{
  flex:1; border:1px solid var(--line); border-radius:20px; padding:8px 14px;
  font-family:'Inter',sans-serif; font-size:13px; background:var(--card); color:var(--ink);
}
.pack-add-row button{
  border:1px solid var(--pine); background:var(--pine); color:#F3EFE3;
  border-radius:20px; padding:8px 16px; font-size:13px; cursor:pointer; white-space:nowrap;
}

/* sync status */
.sync-row{
  display:flex; align-items:center; gap:6px; margin-top:8px;
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.8;
}
.sync-dot{width:7px; height:7px; border-radius:50%; background:#8FBF9A; flex:0 0 auto;}
.sync-dot.off{background:#D9A45C;}
.sync-dot.err{background:#E06A55;}
.sync-row button{
  background:none; border:none; color:#F3EFE3; text-decoration:underline;
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; cursor:pointer; padding:0; opacity:.85;
}

/* settings form */
.form-row{margin-bottom:14px;}
.form-row label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--pine);}
.form-row input{
  width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  font-family:'Inter',sans-serif; font-size:13.5px; background:var(--card); color:var(--ink);
}
.form-hint{font-size:11.5px; color:#8B9284; margin-top:5px; line-height:1.5;}
.form-hint a{color:var(--sky);}
.form-btn{
  width:100%; background:var(--pine); color:#F3EFE3; border:none; border-radius:10px;
  padding:12px; font-size:14px; font-weight:600; cursor:pointer; margin-top:6px;
}
.form-btn.secondary{background:none; border:1px solid var(--line); color:var(--ink);}

/* ---------- Overlay (48h / packing) ---------- */
.overlay-bg{
  position:fixed; inset:0; background:rgba(20,26,20,.5); z-index:60;
  display:none; align-items:flex-end; justify-content:center;
}
.overlay-bg.open{display:flex;}
.sheet{
  background:var(--stone); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:18px 18px 26px 18px; animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.sheet-title{font-family:'Fraunces',serif; font-weight:700; font-size:19px;}
.close-btn{background:none;border:none;font-size:22px;color:#5B6459;cursor:pointer; line-height:1; padding:4px 8px;}
.pre48-item{
  display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px dashed var(--line);
}
.pre48-item:first-child{border-top:none;}
.chk{
  width:22px; height:22px; border-radius:7px; border:2px solid var(--pine); flex:0 0 auto; margin-top:1px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--card);
}
.chk.on{background:var(--pine);}
.chk svg{display:none; width:13px; height:13px;}
.chk.on svg{display:block;}
.pre48-txt b{font-size:14px;}
.pre48-txt div{font-size:12.5px; color:#5B6459; margin-top:2px; line-height:1.45;}

/* ---------- Bottom bar ---------- */
.bottombar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--card); border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom)) 16px;
  display:flex; align-items:center; gap:12px;
}
.bb-track{flex:1; height:6px; background:var(--stone-2); border-radius:6px; overflow:hidden;}
.bb-fill{height:100%; background:var(--pine); border-radius:6px; transition:width .25s ease;}
.bb-label{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#5B6459; white-space:nowrap;}

@media(min-width:680px){
  .day-title{font-size:32px;}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div>
      <p class="trip-title">Abruzzo</p>
      <p class="trip-sub">18–22 agosto 2026 · L'Aquila · Fiat 500X</p>
    </div>
    <button class="menu-btn" id="menuBtn">☰ Menù</button>
  </div>
  <div class="sync-row" id="syncRow">
    <span class="sync-dot off" id="syncDot"></span>
    <span id="syncText">Caricamento...</span>
    <button id="syncNowBtn">Aggiorna ora</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="overview-wrap">
  <button class="overview-toggle" id="ovToggle">
    <span>Colpo d'occhio sul viaggio</span>
    <span id="ovArrow">▾</span>
  </button>
  <div class="overview-body" id="ovBody"></div>
</div>

<main id="main"></main>

<div class="bottombar">
  <span class="bb-label" id="bbLabel">0/0</span>
  <div class="bb-track"><div class="bb-fill" id="bbFill" style="width:0%"></div></div>
  <span class="bb-label" id="bbTripLabel">Viaggio 0%</span>
</div>

<div class="overlay-bg" id="overlayBg">
  <div class="sheet" id="sheetContent"></div>
</div>

/* ============ GITHUB SYNC ============ */
const GH_OWNER = "nicolapaese87-jpg";
const GH_REPO = "gaiettaleabruzzo";
const GH_PATH = "data.json";
const GH_BRANCH = "main";

function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

function ghToken(){ return lsGet('gh_pat') || ''; }
function ghUser(){ return lsGet('gh_user') || ''; }

function ghRawUrl(){ return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_PATH}?t=${Date.now()}`; }
function ghApiUrl(){ return `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`; }

async function ghFetchRemote(){
  const res = await fetch(ghRawUrl(), {cache:"no-store"});
  if(res.status===404) return null;
  if(!res.ok) throw new Error("fetch-failed-"+res.status);
  return await res.json();
}

async function ghSave(newState){
  const token = ghToken();
  if(!token) throw new Error("no-token");
  let sha = null;
  const infoRes = await fetch(ghApiUrl()+`?ref=${GH_BRANCH}`, {headers:{Authorization:`token ${token}`, Accept:'application/vnd.github+json'}});
  if(infoRes.ok){ const info = await infoRes.json(); sha = info.sha; }
  else if(infoRes.status!==404){ throw new Error("auth-failed-"+infoRes.status); }
  const body = {
    message: `Aggiornamento di ${ghUser()||'un admin'}`,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(newState, null, 2)))),
    branch: GH_BRANCH,
  };
  if(sha) body.sha = sha;
  const putRes = await fetch(ghApiUrl(), {
    method:"PUT",
    headers:{Authorization:`token ${token}`, Accept:'application/vnd.github+json', "Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  if(!putRes.ok){
    const err = await putRes.json().catch(()=>({}));
    throw new Error("save-failed: "+(err.message||putRes.status));
  }
}

let state = { days:{}, pre48:{items:{}, notes:""}, packing:{items:{}, custom:[]}, _meta:{} };
let currentDay = 1;
let dirty = false;

function emptyDayState(d){ return { tappe:{}, pack:{}, packCustom:[], note:"", goalText:d.goal }; }

function defaultState(){
  const s = { days:{}, pre48:{items:{}, notes:""}, packing:{items:{}, custom:[]}, _meta:{} };
  DAYS.forEach(d=> s.days[d.id] = emptyDayState(d));
  return s;
}

function mergeIntoDefaults(remote){
  const base = defaultState();
  if(!remote) return base;
  DAYS.forEach(d=>{
    base.days[d.id] = Object.assign(emptyDayState(d), remote.days && remote.days[d.id] ? remote.days[d.id] : {});
  });
  base.pre48 = remote.pre48 || base.pre48;
  base.packing = remote.packing || base.packing;
  base._meta = remote._meta || {};
  return base;
}

function setSyncStatus(mode, text){
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if(!dot) return;
  dot.className = 'sync-dot ' + (mode==='ok'?'':mode==='off'?'off':'err');
  txt.textContent = text;
}

async function loadAll(){
  setSyncStatus('off','Connessione a GitHub...');
  try{
    const remote = await ghFetchRemote();
    state = mergeIntoDefaults(remote);
    if(!ghToken()){
      setSyncStatus('off','Lettura ok · connetti il tuo account per scrivere');
    } else {
      setSyncStatus('ok', metaLabel());
    }
  }catch(e){
    state = defaultState();
    setSyncStatus('err','Impossibile leggere da GitHub — modifiche solo locali');
  }
}

function metaLabel(){
  const m = state._meta;
  if(m && m.by && m.at){
    const d = new Date(m.at);
    const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
    return `Sincronizzato · ultima modifica di ${m.by} alle ${hh}:${mm}`;
  }
  return 'Sincronizzato';
}

async function pushSave(){
  if(!ghToken()){ setSyncStatus('off','Non connesso — apri Menù → Collega GitHub per salvare online'); return; }
  state._meta = { by: ghUser()||'un admin', at: new Date().toISOString() };
  setSyncStatus('off','Salvataggio in corso...');
  try{
    await ghSave(state);
    setSyncStatus('ok', metaLabel());
  }catch(e){
    setSyncStatus('err', e.message==='no-token' ? 'Token mancante' : 'Errore di salvataggio — controlla il token');
  }
}

function saveDebounced(){
  dirty = true;
  clearTimeout(saveDebounced._t);
  saveDebounced._t = setTimeout(()=>{ dirty=false; pushSave(); }, 1200);
}

async function pollRemote(){
  if(dirty) return;
  const active = document.activeElement;
  if(active && (active.tagName==='TEXTAREA' || active.tagName==='INPUT')) return;
  try{
    const remote = await ghFetchRemote();
    if(remote && JSON.stringify(remote)!==JSON.stringify(state)){
      state = mergeIntoDefaults(remote);
      renderAll();
      setSyncStatus('ok', metaLabel());
    }
  }catch(e){ /* silent */ }
}
setInterval(pollRemote, 25000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollRemote(); });

/* ============ RIDGE SVG ============ */
function ridgeSvg(color, seed){
  const pts=[]; let x=0; const w=600,h=22;
  let y = h*0.7;
  const rnd = (n)=> Math.abs(Math.sin(seed*99+n*17))%1;
  let i=0;
  pts.push(`0,${h}`);
  while(x<w){
    const step = 26 + rnd(i)*20;
    y = h*0.25 + rnd(i+1)*h*0.55;
    x += step;
    pts.push(`${Math.min(x,w).toFixed(1)},${y.toFixed(1)}`);
    i++;
  }
  pts.push(`${w},${h}`);
  return `<svg class="ridge" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${pts.join(' ')}" fill="${color}" opacity="0.9"/>
  </svg>`;
}

function tappeProgress(d){
  const items = d.timeline.filter(t=>t.checklist);
  const done = items.filter(t=> state.days[d.id].tappe[t.id]).length;
  return {done, total:items.length};
}

  const noteBox = document.getElementById('noteBox');
  noteBox.addEventListener('input', ()=>{ ds.note = noteBox.value; saveDebounced(); });
}

function renderBottomBar(){
  const d = DAYS.find(x=>x.id===currentDay);
  const prog = tappeProgress(d);
  const pct = prog.total? Math.round(prog.done/prog.total*100) : 0;
  document.getElementById('bbLabel').textContent = `${prog.done}/${prog.total} oggi`;
  document.getElementById('bbFill').style.width = pct+'%';

  let totalDone=0, totalAll=0;
  DAYS.forEach(dd=>{ const p = tappeProgress(dd); totalDone+=p.done; totalAll+=p.total; });
  const tripPct = totalAll? Math.round(totalDone/totalAll*100) : 0;
  document.getElementById('bbTripLabel').textContent = `Viaggio ${tripPct}%`;
}

function renderAll(){
  renderTabs();
  renderMain();
  renderBottomBar();
}

      <button class="overview-toggle" id="btnPre48" style="text-align:left;">⚠️ 5 controlli 48h prima</button>
      <button class="overview-toggle" id="btnPacking" style="text-align:left;">🎒 Zaino sempre in auto</button>
      <button class="overview-toggle" id="btnGithub" style="text-align:left;">${connected? '🔗 Connesso come '+ghUser() : '🔗 Collega GitHub (per salvare online)'}</button>
    </div>
  `);
  document.getElementById('closeSheet').addEventListener('click', closeOverlay);
  document.getElementById('btnPre48').addEventListener('click', pre48Sheet);
  document.getElementById('btnPacking').addEventListener('click', packingSheet);
  document.getElementById('btnGithub').addEventListener('click', githubSheet);
}

function githubSheet(){
  openOverlay(`
    <div class="sheet-head">
      <div class="sheet-title">Collega GitHub</div>
      <button class="close-btn" id="closeSheet">×</button>
    </div>
    <div class="form-hint" style="margin-bottom:14px;">
      Repository: <b>${GH_OWNER}/${GH_REPO}</b><br>
      Il token ti dà i permessi per salvare le modifiche online. Resta solo su questo dispositivo.
    </div>
    <div class="form-row">
      <label>Il tuo nome</label>
      <input type="text" id="ghUserInput" placeholder="Ale oppure Gaietta" value="${ghUser()}">
    </div>
    <div class="form-row">
      <label>Personal Access Token</label>
      <input type="password" id="ghTokenInput" placeholder="ghp_..." value="${ghToken()}">
      <div class="form-hint">
        Non ce l'hai ancora? Vai su <a href="https://github.com/settings/tokens/new?scopes=repo&description=Abruzzo%20trip" target="_blank" rel="noopener">github.com/settings/tokens</a>,
        crea un token classico con permesso <b>repo</b>, copialo e incollalo qui.
      </div>
    </div>
    <button class="form-btn" id="ghSaveBtn">Salva e connetti</button>
    ${ghToken()?'<button class="form-btn secondary" id="ghDisconnectBtn" style="margin-top:8px;">Disconnetti da questo dispositivo</button>':''}
    <div class="save-hint" id="ghStatus" style="margin-top:10px;"></div>
  `);
  document.getElementById('closeSheet').addEventListener('click', closeOverlay);
  document.getElementById('ghSaveBtn').addEventListener('click', async ()=>{
    const user = document.getElementById('ghUserInput').value.trim();
    const token = document.getElementById('ghTokenInput').value.trim();
    const status = document.getElementById('ghStatus');
    if(!user || !token){ status.textContent = 'Inserisci nome e token.'; return; }
    lsSet('gh_user', user); lsSet('gh_pat', token);
    status.textContent = 'Verifica in corso...';
    try{
      await pushSave();
      status.textContent = 'Connesso e salvato correttamente ✓';
      renderAll();
    }catch(e){
      status.textContent = 'Token non valido o senza permessi sul repo.';
    }
  });
  const disc = document.getElementById('ghDisconnectBtn');
  if(disc) disc.addEventListener('click', ()=>{
    lsSet('gh_user',''); lsSet('gh_pat','');
    closeOverlay(); setSyncStatus('off','Non connesso');
  });
}

function checkSvg(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#F3EFE3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function pre48Sheet(){
  const done = PRE48.filter(p=> state.pre48.items[p.id]).length;
  openOverlay(`
    <div class="sheet-head">
      <div class="sheet-title">48h prima di partire</div>
      <button class="close-btn" id="closeSheet">×</button>
    </div>
    <div class="save-hint" style="margin-bottom:6px;">${done}/${PRE48.length} controllati</div>
    ${PRE48.map(p=>`
      <div class="pre48-item">
        <div class="chk ${state.pre48.items[p.id]?'on':''}" data-p48="${p.id}">${checkSvg()}</div>
        <div class="pre48-txt"><b>${p.title}</b><div>${p.desc}</div></div>
      </div>`).join('')}
    <div class="section" style="margin-top:16px;">
      <div class="section-title" style="font-size:14px;">Appunti generali</div>
      <textarea class="note" id="pre48Notes" placeholder="Es. esito telefonata Baita, previsioni meteo confermate...">${state.pre48.notes||''}</textarea>
    </div>
  `);
  document.getElementById('closeSheet').addEventListener('click', closeOverlay);
  document.querySelectorAll('[data-p48]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.p48;
    state.pre48.items[id] = !state.pre48.items[id];
    saveDebounced();
    pre48Sheet();
  }));
  const notes = document.getElementById('pre48Notes');
  notes.addEventListener('input', ()=>{ state.pre48.notes = notes.value; saveDebounced(); });
}

function packingSheet(){
  state.packing.custom = state.packing.custom || [];
  const totalItems = ALWAYS_PACK.length + state.packing.custom.length;
  const done = ALWAYS_PACK.filter(p=> state.packing.items[p.id]).length
             + state.packing.custom.filter(p=> state.packing.items[p.id]).length;
  openOverlay(`
    <div class="sheet-head">
      <div class="sheet-title">Zaino sempre in auto</div>
      <button class="close-btn" id="closeSheet">×</button>
    </div>
    <div class="save-hint" style="margin-bottom:6px;">${done}/${totalItems} pronti</div>
    <div class="chip-grid">
      ${ALWAYS_PACK.map(p=>{
        const on = state.packing.items[p.id];
        return `<button class="pack-chip ${on?'on':''}" data-apid="${p.id}">${on?'✓ ':''}${p.label}</button>`;
      }).join('')}
      ${state.packing.custom.map(p=>{
        const on = state.packing.items[p.id];
        return `<button class="pack-chip ${on?'on':''}" data-apid="${p.id}">${on?'✓ ':''}${p.label} <span class="rm" data-rmapid="${p.id}">✕</span></button>`;
      }).join('')}
    </div>
    <div class="pack-add-row">
      <input type="text" id="packAddInputGlobal" placeholder="Aggiungi una voce...">
      <button id="packAddBtnGlobal">+ Aggiungi</button>
    </div>
  `);
  document.getElementById('closeSheet').addEventListener('click', closeOverlay);
  document.querySelectorAll('[data-apid]').forEach(b=> b.addEventListener('click', (e)=>{
    if(e.target.closest('[data-rmapid]')) return;
    const id = b.dataset.apid;
    state.packing.items[id] = !state.packing.items[id];
    saveDebounced();
    packingSheet();
  }));
  document.querySelectorAll('[data-rmapid]').forEach(x=> x.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id = x.dataset.rmapid;
    state.packing.custom = state.packing.custom.filter(p=>p.id!==id);
    delete state.packing.items[id];
    saveDebounced();
    packingSheet();
  }));
  document.getElementById('packAddBtnGlobal').addEventListener('click', ()=>{
    const input = document.getElementById('packAddInputGlobal');
    const label = input.value.trim();
    if(!label) return;
    const id = 'gc'+Date.now();
    state.packing.custom.push({id, label});
    saveDebounced();
    packingSheet();
  });
  document.getElementById('packAddInputGlobal').addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('packAddBtnGlobal').click(); }
  });
}

/* ============ INIT ============ */
document.getElementById('menuBtn').addEventListener('click', menuSheet);
document.getElementById('syncNowBtn').addEventListener('click', async ()=>{
  setSyncStatus('off','Aggiornamento...');
  await pollRemoteForce();
});
async function pollRemoteForce(){
  try{
    const remote = await ghFetchRemote();
    state = mergeIntoDefaults(remote);
    renderAll();
    setSyncStatus(ghToken()?'ok':'off', ghToken()?metaLabel():'Lettura ok · non connesso per scrivere');
  }catch(e){
    setSyncStatus('err','Errore di aggiornamento');
  }
}
document.getElementById('overlayBg').addEventListener('click', (e)=>{ if(e.target.id==='overlayBg') closeOverlay(); });
document.getElementById('ovToggle').addEventListener('click', ()=>{
  document.getElementById('ovBody').classList.toggle('open');
  document.getElementById('ovArrow').textContent = document.getElementById('ovBody').classList.contains('open') ? '▴' : '▾';
});

function pickInitialDay(){
  try{
    const now = new Date();
    const y=now.getFullYear(), m=now.getMonth()+1, dd=now.getDate();
    if(y===2026 && m===8 && dd>=18 && dd<=22) return dd-17;
  }catch(e){}
  return 1;
}

(async function init(){
  currentDay = pickInitialDay();
  await loadAll();
  renderOverview();
  renderAll();
})();
</script>
</body>
